server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not declare a `types {}` block here: it would replace nginx's defaults (html/js/css) and the
    # stock mime.types already maps .wasm to application/wasm, which streaming compilation requires.

    # The network weights (.data) are already compressed; gzip only helps the text/wasm files.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # App code: always revalidate (ETag makes this a cheap 304).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ~40 MB of engine files: cache for a day so returning players do not download them again.
    location /engine/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
